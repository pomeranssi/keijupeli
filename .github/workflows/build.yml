name: Test Keijupeli

on: [workflow_dispatch, push]

jobs:
  build:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # Postgres client tools are only needed by the prod copy scripts.
      # The mise postinstall hook runs `yarn install`, which is immutable on CI.
      - name: Install tools and deps
        uses: jdx/mise-action@v3
        with:
          install_args: node yarn

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format-check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build client
        run: yarn build-client

      - name: Build server
        run: yarn build-server
